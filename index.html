<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WebGoNow Greece — Coming Soon</title>
  <meta name="description" content="WebGoNow Greece — Digital solutions, web development & SaaS. Launching soon." />

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --text-primary: #1c2026;
      --text-secondary: #64748b;
      --accent: #00b87c;
      --accent-soft: #94a3b8;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100dvh;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 38%, rgba(0, 184, 124, 0.06) 0%, rgba(255, 255, 255, 1) 65%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .spacer {
      height: 0.5rem;
    }

    main {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .logo {
      width: clamp(190px, 58vw, 250px);
      height: auto;
      margin-bottom: 1.5rem;
    }

    /* Large, expressive 3-gear Google-inspired mechanical loader */
    .gear-stage {
      position: relative;
      width: 156px;
      height: 118px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: stageFloat 4s ease-in-out infinite;
    }

    .gear-glow {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 184, 124, 0.22) 0%, rgba(0, 184, 124, 0) 72%);
      animation: pulseGlow 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    .gear {
      position: absolute;
      transform-origin: center center;
      will-change: transform;
      filter: drop-shadow(0 6px 14px rgba(28, 32, 38, 0.08));
    }

    /* Main large emerald gear */
    .gear-1 {
      width: 66px;
      height: 66px;
      top: 10px;
      left: 20px;
      color: var(--accent);
      animation: spinCW 4.2s cubic-bezier(0.45, 0.05, 0.2, 0.95) infinite;
    }

    /* Interlocking dark charcoal gear */
    .gear-2 {
      width: 48px;
      height: 48px;
      top: 44px;
      right: 24px;
      color: var(--text-primary);
      animation: spinCCW 4.2s cubic-bezier(0.45, 0.05, 0.2, 0.95) infinite;
    }

    /* Third micro accent gear */
    .gear-3 {
      width: 34px;
      height: 34px;
      bottom: 8px;
      left: 54px;
      color: var(--accent-soft);
      animation: spinCWOffset 4.2s cubic-bezier(0.45, 0.05, 0.2, 0.95) infinite;
    }

    @keyframes spinCW {
      0% { transform: rotate(0deg); }
      45% { transform: rotate(210deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCCW {
      0% { transform: rotate(18deg); }
      45% { transform: rotate(-192deg); }
      100% { transform: rotate(-342deg); }
    }

    @keyframes spinCWOffset {
      0% { transform: rotate(-12deg); }
      45% { transform: rotate(198deg); }
      100% { transform: rotate(348deg); }
    }

    @keyframes stageFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.18); opacity: 1; }
    }

    h1 {
      font-size: clamp(1.6rem, 6.2vw, 2.3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.18;
      margin-bottom: 0.85rem;
      padding: 0 0.25rem;
    }

    p {
      font-size: clamp(0.95rem, 3.8vw, 1.05rem);
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 1.85rem;
      max-width: 390px;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      background: #ffffff;
      padding: 0.85rem 1.5rem;
      min-height: 48px;
      width: 100%;
      max-width: 310px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      transition: all 0.22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .contact-link:hover,
    .contact-link:active {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 184, 124, 0.12);
    }

    footer {
      font-size: 0.78rem;
      color: #94a3b8;
      padding-top: 1.5rem;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

    <p>
