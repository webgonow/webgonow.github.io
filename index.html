<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGoNow Greece — Coming Soon</title>
  <meta name="description" content="WebGoNow Greece — Digital solutions, web development & SaaS. Launching soon." />

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --text-primary: #1c2026;
      --text-secondary: #64748b;
      --accent: #00b87c;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 2.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .spacer {
      height: 1rem;
    }

    main {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.7s ease-out both;
    }

    .logo {
      width: 240px;
      max-width: 75%;
      height: auto;
      margin-bottom: 1.75rem;
    }

    /* Google-style interlocking gear loader */
    .gear-loader {
      position: relative;
      width: 64px;
      height: 44px;
      margin-bottom: 1.75rem;
    }

    .gear-primary {
      position: absolute;
      top: 0;
      left: 6px;
      width: 32px;
      height: 32px;
      color: var(--accent);
      animation: spinClockwise 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .gear-secondary {
      position: absolute;
      bottom: 0;
      right: 8px;
      width: 22px;
      height: 22px;
      color: var(--text-primary);
      animation: spinCounterClockwise 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spinClockwise {
      0% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(180deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes spinCounterClockwise {
      0% {
        transform: rotate(15deg);
      }
      50% {
        transform: rotate(-165deg);
      }
      100% {
        transform: rotate(-345deg);
      }
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 0.9rem;
    }

    p {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      font-size: 0.925rem;
      font-weight: 600;
      color: var(--text-primary);
      padding: 0.75rem 1.4rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .contact-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    footer {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

    <p>

      Stay tuned for modern web &amp; software solutions.

    <a href="mailto:webgonowgreece@gmail.com" class="contact-link">

  </main>
