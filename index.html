<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WebGoNow Greece — Coming Soon</title>
  <meta name="description" content="WebGoNow Greece — Digital solutions, web development & SaaS. Launching soon." />

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --text-primary: #1c2026;
      --text-secondary: #64748b;
      --accent: #00b87c;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100dvh;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fbfefc;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Big Material-style shapes drifting around the screen edges */
    #shapes {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    #shapes .shape {
      position: absolute;
      will-change: transform;
    }

    #shapes svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .spacer {
      height: 0.5rem;
      position: relative;
      z-index: 1;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* soft white halo keeps text readable when a shape drifts behind it */
    main::before {
      content: "";
      position: absolute;
      inset: -2rem -1.5rem;
      z-index: -1;
      background: radial-gradient(ellipse at center, rgba(251, 254, 252, 0.92) 0%, rgba(251, 254, 252, 0.7) 55%, rgba(251, 254, 252, 0) 100%);
      pointer-events: none;
    }

    .logo {
      width: clamp(190px, 58vw, 250px);
      height: auto;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: clamp(1.6rem, 6.2vw, 2.3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.18;
      margin-bottom: 0.85rem;
      padding: 0 0.25rem;
    }

    p {
      font-size: clamp(0.95rem, 3.8vw, 1.05rem);
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 1.85rem;
      max-width: 390px;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      background: #ffffff;
      padding: 0.85rem 1.5rem;
      min-height: 48px;
      width: 100%;
      max-width: 310px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      transition: all 0.22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .contact-link:hover,
    .contact-link:active {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 184, 124, 0.12);
    }

    .contact-link:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    footer {
      position: relative;
      z-index: 1;
      font-size: 0.78rem;
      color: #64748b;
      padding-top: 1.5rem;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="shapes" aria-hidden="true"></div>

  <div class="spacer"></div>

  <main>
    <img
      src="img/logo-removebg.png"
      alt="WebGoNow Greece Logo"
      class="logo"
    />

    <h1>Something new is on the way.</h1>

    <p>
      We are currently crafting the new digital home of <strong>WebGoNow Greece</strong>.
      Stay tuned for modern web &amp; software solutions.
    </p>

    <a href="mailto:webgonowgreece@gmail.com" class="contact-link">
      webgonowgreece@gmail.com
    </a>
  </main>

  <footer>
    &copy; 2026 WebGoNow Greece. All rights reserved.
  </footer>

  <script>
    /*
      Material 3 Expressive style shapes: a scalloped / flower outline
      r(θ) = (1 + a·cos(n·θ)) / (1 + a)
      n = number of lobes, a = how deep the lobes are.
      Each shape morphs its depth "a" over time, rotates, and drifts
      up/down and/or left/right across the screen edges.
      ax / ay = drift distance in vmax units.
    */
    var SHAPES = [
      // top-left: big emerald cookie, drifts left/right
      { color: '#00b87c', n: 9,  a0: 0.03, a1: 0.10, size: 64, left: -24, top: -24, ax: 12, ay: 0,  v: 0.30, m: 0.60, rot: 6,   p: 0.0, op: 1 },
      // top-right: mint flower, drifts up/down
      { color: '#c4f1de', n: 6,  a0: 0.10, a1: 0.30, size: 56, right: -20, top: -20, ax: 0,  ay: 12, v: 0.26, m: 0.50, rot: -5,  p: 1.7, op: 1 },
      // bottom-left: butter clover, drifts up/down
      { color: '#ffe48a', n: 4,  a0: 0.12, a1: 0.30, size: 50, left: -20, bottom: -22, ax: 0,  ay: -13, v: 0.28, m: 0.70, rot: 7,   p: 3.1, op: 1 },
      // bottom-right: sky burst, drifts left/right
      { color: '#b9e3ff', n: 12, a0: 0.04, a1: 0.12, size: 46, right: -16, bottom: -18, ax: -12, ay: 0,  v: 0.24, m: 0.55, rot: -8,  p: 2.2, op: 1 },
      // left edge: small charcoal scallop, drifts up/down
      { color: '#1c2026', n: 7,  a0: 0.05, a1: 0.16, size: 26, left: -14, top: '40%', ax: 0,  ay: 14, v: 0.34, m: 0.80, rot: 10,  p: 0.9, op: 1 },
      // right edge: emerald-soft sunny, drifts in a loop
      { color: '#6fddb4', n: 8,  a0: 0.06, a1: 0.22, size: 30, right: -15, top: '50%', ax: -9, ay: 9,  v: 0.30, m: 0.65, rot: -9,  p: 4.0, op: 1 },
      // top edge: small butter pill-ish oval, drifts left/right
      { color: '#ffe48a', n: 2,  a0: 0.10, a1: 0.26, size: 22, left: '46%', top: -12, ax: 16, ay: 0,  v: 0.22, m: 0.40, rot: 12,  p: 5.0, op: 1 },
      // bottom edge: small mint cookie, drifts left/right
      { color: '#9fe8c9', n: 10, a0: 0.03, a1: 0.09, size: 24, left: '28%', bottom: -14, ax: -15, ay: 0, v: 0.25, m: 0.50, rot: -10, p: 2.8, op: 1 }
    ];

    var NS = 'http://www.w3.org/2000/svg';
    var host = document.getElementById('shapes');

    function outline(n, a) {
      var d = '', steps = 180;
      for (var i = 0; i <= steps; i++) {
        var t = i / steps * Math.PI * 2;
        var r = (1 + a * Math.cos(n * t)) / (1 + a);
        d += (i ? 'L' : 'M') + (Math.cos(t) * r).toFixed(3) + ' ' + (Math.sin(t) * r).toFixed(3);
      }
      return d + 'Z';
    }

    SHAPES.forEach(function (s) {
      var el = document.createElement('div');
      el.className = 'shape';
      el.style.width = el.style.height = s.size + 'vmax';
      ['left', 'right', 'top', 'bottom'].forEach(function (k) {
        if (s[k] !== undefined) el.style[k] = typeof s[k] === 'number' ? s[k] + 'vmax' : s[k];
      });
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '-1 -1 2 2');
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('fill', s.color);
      path.setAttribute('opacity', s.op);
      svg.appendChild(path);
      el.appendChild(svg);
      host.appendChild(el);
      s.el = el;
      s.path = path;
    });

    function frame(ms) {
      var t = ms / 1000;
      var u = Math.max(window.innerWidth, window.innerHeight) / 100;
      SHAPES.forEach(function (s) {
        var morph = 0.5 + 0.5 * Math.sin(t * s.m + s.p);
        s.path.setAttribute('d', outline(s.n, s.a0 + (s.a1 - s.a0) * morph));
        var dx = s.ax * Math.sin(t * s.v + s.p) * u;
        var dy = s.ay * Math.sin(t * s.v + s.p + (s.ax && s.ay ? 1.57 : 0)) * u;
        var rot = s.rot * t;
        s.el.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg)';
      });
      if (!reduce) requestAnimationFrame(frame);
    }

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    requestAnimationFrame(frame);
  </script>
</body>
</html>
